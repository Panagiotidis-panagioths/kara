<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>KARAFUSE</title>
    <link rel="icon" href="fuse.png" type="image/x-icon">
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        font-family: sans-serif;
        background-image: url("fuse.png");
      }

      h1 {
        background-color: black;
        color: white;
        padding: 30px;
        text-align: center;
        text-decoration: underline;
      }

      nav {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 1px 2px #0a0a0a, 0 1px 2px #00bfff;
        padding: 1rem 0;
        margin-bottom: 40px;
      }

      nav ul {
        list-style: none;
        display: flex;
        justify-content: center;
        gap: 2rem;
      }

      nav ul li a {
        text-decoration: none;
        color: #000000;
        font-size: 1.2rem;
        font-weight: 700;
        padding: 0.5rem 1rem;
        transition: color 0.3s, transform 0.3s, background 0.3s;
        border-radius: 5px;
      }

      nav ul li a:hover {
        color: #000000;
        transform: scale(1.1);
        background: rgba(97, 0, 153, 0.1);
      }

      .carousel-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 30px;
        max-width: 1200px;
        margin: 0 auto;
      }

      .product-card {
        display: flex;
        flex-direction: column;
        background-color: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        width: 300px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      }

      .product-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }

      .product-info {
        padding: 20px;
        text-align: left;
      }

      .product-title {
        font-size: 1.1rem;
        color: #000000;
        margin-bottom: 8px;
      }

      .product-price {
        font-size: 1.2rem;
        font-weight: bold;
        color: #000000;
        margin-bottom: 16px;
      }

      .add-to-cart-btn {
        width: 100%;
        background-color: #000000;
        color: white;
        border: none;
        padding: 12px 0;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .add-to-cart-btn:hover {
        background-color: #333333;
      }
img{
  width: 100%;
}
      .nav-btn {
        background-color: #000000;
        color: #ffffff;
        border: none;
        font-size: 24px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }

pre{
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
  color: white;
}
hr{
  background-color: white;
  width: 20%;
}
p{
font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
 
  color: white;
}
header{
  background-color: black;
  font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}
br {
   display: block;
   margin: 10px 0;
}
      .nav-btn:hover {
        background-color: #333333;
        transform: scale(1.1);
      }

      .nav-btn:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <center>
    <main>
            <header><b>
        <p>KARAFUSE becomes KARAKVIK - new name, same energy</p> 
        <hr>

<p><pre >AUTUMN SALE: Buy 3, pay for 2!
Buy 6, pay for 4 + free water bottle 🎁</pre></p></b>
</header>
        <nav>
            <ul>
                <li><a href="about.html">ABOUT US</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>

        <div class="carousel-container">
            <button class="nav-btn" id="prevBtn" aria-label="Previous Flavor">&#10094;</button>

            <article class="product-card">
              
                <img id="product-img" src="apple.webp" alt="Taste Apple" class="product-image">
                <div class="product-info">
                  <h3 id="product-title" class="product-title">Taste Apple</h3>
                  <p id="product-price" class="product-price">$149.00</p>
                  <button class="add-to-cart-btn" onclick="window.open('https://www.youtube.com/watch?v=zswT92VzOYM')">Add to Cart</button>
                </div>
            </article>

            <button class="nav-btn" id="nextBtn" aria-label="Next Flavor">&#10095;</button>
        </div>

    </main>

    <script>
      const flavors = [
        {
          title: "Taste Apple",
          price: "$149.00",
          image: "apple.webp",
          alt: "apple"
        },
        {
          title: "Orange",
          price: "$349.00",
          image: "orange.jpg",
          alt: "orange"
        },
        {
          title: "Strawberry",
          price: "$67.00",
          image: "straw.jpg",
          alt: "straw"
        }
      ];

      let currentIndex = 0;

      const imgElement = document.getElementById("product-img");
      const titleElement = document.getElementById("product-title");
      const priceElement = document.getElementById("product-price");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      function updateProduct(index) {
        const flavor = flavors[index];
        imgElement.src = flavor.image;
        imgElement.alt = flavor.alt;
        titleElement.textContent = flavor.title;
        priceElement.textContent = flavor.price;
      }

      prevBtn.addEventListener("click", () => {
        currentIndex = (currentIndex - 1 + flavors.length) % flavors.length;
        updateProduct(currentIndex);
      });

      nextBtn.addEventListener("click", () => {
        currentIndex = (currentIndex + 1) % flavors.length;
        updateProduct(currentIndex);
      });
    </script>

    <br>

    <hr></hr>
    <br>

    <img src="ing.png" alt="ing">
  </body>
</html>
